<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApexU Reports</title>
<meta name="robots" content="noindex">
<!--
  Thin shell (2026-09-28). The report generator lives in ONE place:
  Apex1-Consol/ApexOne report-generator.html (canonical). This portal used to
  carry a stale copy of it, which drifted ~500 lines behind and still wrote
  report statuses directly (now rejected by reports.transition_report guards).
  Both pages are on the same origin (apex1-consol.github.io), so the Supabase
  session carries over and sign-in, Turnstile and RLS are handled there.
  Do not copy generator code back into this repo.
-->
<style>
  :root{color-scheme:light dark;--bg:#0c2f52;--fg:#fff;--muted:rgba(255,255,255,.7);--gold:#d4a537}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{padding:24px 16px;text-align:center;max-width:420px}
  a{color:var(--gold);font-weight:700}
  p{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.25rem;margin:0 0 8px">ApexU Monthly Reports</h1>
  <p id="msg">Opening the report generator&hellip;</p>
  <p><a id="go" href="/report-generator.html">Continue to the report generator</a></p>
</main>
<script>
(function () {
  var target = '/report-generator.html' + location.search + location.hash;
  document.getElementById('go').href = target;
  function go() { location.replace(target); }
  // Retire the old offline worker and its cached copy of the stale generator.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.filter(function (r) { return r.scope.indexOf('/Apex1-Consol-apexu-reports/') !== -1; })
        .map(function (r) { return r.unregister(); }));
    }).then(function () {
      return window.caches ? caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('apex-report-') === 0; }).map(function (k) { return caches.delete(k); }));
      }) : null;
    }).then(go, go);
  } else { go(); }
})();
</script>
</body>
</html>
